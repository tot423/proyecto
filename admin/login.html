<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso administrador | Torneo Fútbol</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-page">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>

    <div class="login-card">
      <a href="index.html" class="back-to-site"><i class="fas fa-arrow-left"></i> Volver al sitio del torneo</a>

      <div class="brand">
        <div class="brand-icon">
          <i class="fas fa-user-shield"></i>
        </div>
        <div>
          <h2>Torneo Fútbol</h2>
          <p>Acceso administrador</p>
        </div>
      </div>

      <div class="login-header">
        <h1>Iniciar sesión</h1>
        <p>Este acceso es solo para quienes gestionan el torneo. Si solo quieres ver la tabla de posiciones, resultados o equipos, no necesitas iniciar sesión.</p>
      </div>

      <form id="loginForm" class="login-form">
        <label class="field">
          <span>Correo electrónico</span>
          <div class="input-icon">
            <i class="fas fa-envelope"></i>
            <input type="email" name="email" placeholder="usuario@correo.com" required autocomplete="username">
          </div>
        </label>

        <label class="field">
          <span>Contraseña</span>
          <div class="input-icon">
            <i class="fas fa-lock"></i>
            <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar contraseña">
              <i class="far fa-eye"></i>
            </button>
          </div>
        </label>

        <div class="options-row">
          <label class="remember-me">
            <input type="checkbox" name="remember">
            <span>Recordarme en este dispositivo</span>
          </label>
          <a href="#">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="login-btn" id="loginSubmitBtn">
          <i class="fas fa-sign-in-alt"></i>
          Entrar al panel
        </button>
      </form>

      <p id="loginError" class="login-error"></p>
    </div>
  </div>

  <script>
    /* =========================================================
       Acceso de administrador.
       IMPORTANTE: esta app no tiene servidor, así que esta
       verificación ocurre en el navegador. No es una seguridad
       infranqueable frente a alguien con conocimientos técnicos,
       pero sí evita el acceso casual y los intentos automáticos.

       Credencial por defecto:
         correo:     admin@torneofutbol.com
         contraseña: Torneo2026!

       Para cambiarla: reemplaza ADMIN_EMAIL, y genera un nuevo
       hash para ADMIN_PASSWORD_HASH ejecutando esto en la consola
       del navegador (F12 → Console) con tu nueva contraseña:

         crypto.subtle.digest('SHA-256', new TextEncoder().encode('TU_NUEVA_CONTRASEÑA'))
           .then(b => console.log([...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('')))

       Copia el resultado y pégalo como valor de ADMIN_PASSWORD_HASH.
    ========================================================= */
    const ADMIN_EMAIL = 'admin@torneofutbol.com';
    const ADMIN_PASSWORD_HASH = 'f8520e8d6fa2eb53146893b27e0a8429c86a84012e0a58d9143c3cb1f2973f1d';

    const MAX_ATTEMPTS = 5;
    const BASE_LOCK_SECONDS = 60;

    async function sha256Hex(text) {
      const buffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return [...new Uint8Array(buffer)].map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function getAttemptState() {
      return JSON.parse(localStorage.getItem('loginAttempts') || 'null') || { count: 0, lockUntil: 0, lockRounds: 0 };
    }
    function saveAttemptState(state) { localStorage.setItem('loginAttempts', JSON.stringify(state)); }

    function remainingLockSeconds(state) {
      return Math.max(0, Math.ceil((state.lockUntil - Date.now()) / 1000));
    }

    function showError(msg) {
      const errorEl = document.getElementById('loginError');
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    }

    function updateLockUI() {
      const state = getAttemptState();
      const remaining = remainingLockSeconds(state);
      const btn = document.getElementById('loginSubmitBtn');
      if (remaining > 0) {
        btn.disabled = true;
        btn.style.opacity = '0.6';
        btn.style.cursor = 'not-allowed';
        showError(`Demasiados intentos fallidos. Intenta de nuevo en ${remaining} segundo${remaining === 1 ? '' : 's'}.`);
        setTimeout(updateLockUI, 1000);
      } else {
        btn.disabled = false;
        btn.style.opacity = '';
        btn.style.cursor = '';
        if (document.getElementById('loginError').textContent.startsWith('Demasiados intentos')) {
          document.getElementById('loginError').style.display = 'none';
        }
      }
    }
    updateLockUI();

    const togglePass = document.getElementById('togglePass');
    const passInput = document.querySelector('input[name="password"]');
    togglePass.addEventListener('click', () => {
      const isHidden = passInput.type === 'password';
      passInput.type = isHidden ? 'text' : 'password';
      togglePass.innerHTML = isHidden ? '<i class="far fa-eye-slash"></i>' : '<i class="far fa-eye"></i>';
    });

    document.getElementById('loginForm').addEventListener('submit', async function (event) {
      event.preventDefault();

      const state = getAttemptState();
      if (remainingLockSeconds(state) > 0) return;

      const data = new FormData(this);
      const email = data.get('email').trim().toLowerCase();
      const password = data.get('password');
      const remember = data.get('remember') === 'on';

      if (!email || !password) {
        showError('Ingresa tu correo y contraseña.');
        return;
      }

      const passwordHash = await sha256Hex(password);
      const isValid = email === ADMIN_EMAIL.toLowerCase() && passwordHash === ADMIN_PASSWORD_HASH;

      if (!isValid) {
        state.count = (state.count || 0) + 1;
        if (state.count >= MAX_ATTEMPTS) {
          state.lockRounds = (state.lockRounds || 0) + 1;
          state.lockUntil = Date.now() + BASE_LOCK_SECONDS * 1000 * state.lockRounds;
          state.count = 0;
        }
        saveAttemptState(state);
        showError('Correo o contraseña incorrectos.');
        updateLockUI();
        return;
      }

      // Login correcto: se reinician los intentos fallidos
      saveAttemptState({ count: 0, lockUntil: 0, lockRounds: 0 });

      const storage = remember ? localStorage : sessionStorage;
      storage.setItem('role', 'admin');
      storage.setItem('userEmail', email);
      window.location.href = 'admin.html';
    });
  </script>
</body>
</html>
