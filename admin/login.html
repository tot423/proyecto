<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso administrador | Torneo Fútbol</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-page">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>

    <div class="login-card">
      <a href="index.html" class="back-to-site"><i class="fas fa-arrow-left"></i> Volver al sitio del torneo</a>

      <div class="brand">
        <div class="brand-icon">
          <i class="fas fa-user-shield"></i>
        </div>
        <div>
          <h2>Torneo Fútbol</h2>
          <p>Acceso administrador</p>
        </div>
      </div>

      <div class="login-header">
        <h1>Iniciar sesión</h1>
        <p>Este acceso es solo para quienes gestionan el torneo. Si solo quieres ver la tabla de posiciones, resultados o equipos, no necesitas iniciar sesión.</p>
      </div>

      <form id="loginForm" class="login-form">
        <label class="field">
          <span>Correo electrónico</span>
          <div class="input-icon">
            <i class="fas fa-envelope"></i>
            <input type="email" name="email" placeholder="usuario@correo.com" required>
          </div>
        </label>

        <label class="field">
          <span>Contraseña</span>
          <div class="input-icon">
            <i class="fas fa-lock"></i>
            <input type="password" name="password" placeholder="••••••••" required>
            <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar contraseña">
              <i class="far fa-eye"></i>
            </button>
          </div>
        </label>

        <div class="options-row">
          <label class="remember-me">
            <input type="checkbox" name="remember">
            <span>Recordarme</span>
          </label>
          <a href="#">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="login-btn">
          <i class="fas fa-sign-in-alt"></i>
          Entrar al panel
        </button>
      </form>

      <p id="loginError" class="login-error"></p>
    </div>
  </div>

  <script>
    const togglePass = document.getElementById('togglePass');
    const passInput = document.querySelector('input[name="password"]');
    togglePass.addEventListener('click', () => {
      const isHidden = passInput.type === 'password';
      passInput.type = isHidden ? 'text' : 'password';
      togglePass.innerHTML = isHidden ? '<i class="far fa-eye-slash"></i>' : '<i class="far fa-eye"></i>';
    });

    document.getElementById('loginForm').addEventListener('submit', function (event) {
      event.preventDefault();
      const data = new FormData(this);
      const email = data.get('email').trim();
      const password = data.get('password');
      const errorEl = document.getElementById('loginError');

      if (!email || !password) {
        errorEl.textContent = 'Ingresa tu correo y contraseña.';
        errorEl.style.display = 'block';
        return;
      }

      localStorage.setItem('role', 'admin');
      localStorage.setItem('userEmail', email);
      window.location.href = 'admin.html';
    });
  </script>
</body>
</html>
