<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Usuario - Torneo Fútbol</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --secondary: #64748b;
      --accent: #f59e0b;
      --success: #10b981; m
      --warning: #f59e0b;
      --error: #ef4444;
      --background: #f8fafc;
      --surface: #ffffff;
      --surface-hover: #f1f5f9;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--background);
      color: var(--text-primary);
      overflow-x: hidden;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
      z-index: 1000;
      box-shadow: var(--shadow-lg);
    }

    .sidebar-header {
      padding: 24px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
    }

    .sidebar-header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .sidebar-header p {
      font-size: 0.875rem;
      opacity: 0.9;
    }

    .sidebar-nav {
      flex: 1;
      padding: 16px 0;
    }

    .nav-item {
      margin: 4px 16px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      color: var(--text-secondary);
      text-decoration: none;
      border-radius: 8px;
      transition: all 0.2s ease;
      font-weight: 500;
      cursor: pointer;
    }

    .nav-link:hover {
      background-color: var(--surface-hover);
      color: var(--text-primary);
    }

    .nav-link.active {
      background-color: var(--primary);
      color: white;
    }

    .nav-link i {
      margin-right: 12px;
      width: 20px;
      text-align: center;
    }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid var(--border);
    }

    .logout-btn {
      width: 100%;
      padding: 12px 16px;
      background: var(--error);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .logout-btn:hover {
      background: #dc2626;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      margin-left: 280px;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 64px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      box-shadow: var(--shadow);
    }

    .topbar-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .content {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
    }

    /* Cards */
    .section-card {
      background: var(--surface);
      border-radius: 12px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
      overflow: hidden;
      transition: box-shadow 0.2s ease;
    }

    .section-card:hover {
      box-shadow: var(--shadow-lg);
    }

    .card-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
    }

    .card-header h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .card-header p {
      font-size: 0.875rem;
      opacity: 0.9;
    }

    .card-content {
      padding: 24px;
    }

    /* Hero Section */
    .hero-section {
      position: relative;
      height: 300px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark)),
                  url('messi.jpg') center/cover;
      border-radius: 12px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .hero-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
    }

    .hero-content {
      position: relative;
      height: 100%;
      display: flex;
      align-items: center;
      padding: 0 24px;
      color: white;
    }

    .hero-text h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .hero-text p {
      font-size: 1.125rem;
      opacity: 0.9;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--surface);
      padding: 20px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      text-align: center;
      border-left: 4px solid var(--accent);
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .stat-label {
      font-size: 0.875rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Tables */
    .table-container {
      overflow-x: auto;
      margin: 20px 0;
    }

    .modern-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .modern-table thead {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
    }

    .modern-table th {
      padding: 16px 12px;
      text-align: left;
      font-weight: 600;
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .modern-table tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background-color 0.2s ease;
    }

    .modern-table tbody tr:hover {
      background-color: var(--surface-hover);
    }

    .modern-table tbody tr:nth-child(even) {
      background-color: #fafbfc;
    }

    .modern-table td {
      padding: 14px 12px;
      font-size: 0.875rem;
    }

    .position {
      font-weight: 700;
      color: var(--primary);
      width: 50px;
      text-align: center;
    }

    .team-name {
      font-weight: 600;
      color: var(--text-primary);
    }

    .points {
      font-weight: 700;
      color: var(--accent);
      text-align: center;
    }

    /* Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin: 24px 0;
    }

    .data-card {
      background: var(--surface);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .data-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .data-card-header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      padding: 16px 20px;
      font-size: 1rem;
      font-weight: 600;
    }

    .data-card-content {
      padding: 20px;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .sidebar {
        width: 240px;
      }
      .main-content {
        margin-left: 240px;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
        transition: transform 0.3s ease;
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .main-content {
        margin-left: 0;
      }
      .topbar {
        padding: 0 16px;
      }
      .content {
        padding: 16px;
      }
      .hero-text h1 {
        font-size: 2rem;
      }
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .cards-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }
      .modern-table th,
      .modern-table td {
        padding: 8px 6px;
        font-size: 0.8rem;
      }
    }

    /* Content sections */
    .content-html {
      margin-top: 16px;
      padding: 16px;
      background: var(--surface-hover);
      border-radius: 8px;
      line-height: 1.6;
    }

    .content-html h3 {
      color: var(--primary);
      margin-top: 16px;
      margin-bottom: 8px;
    }

    .content-html p {
      color: var(--text-secondary);
      margin: 8px 0;
    }

    .content-html ul {
      color: var(--text-secondary);
      margin-left: 20px;
    }

    .content-html li {
      margin: 4px 0;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }
  </head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1><i class="fas fa-trophy"></i> Torneo Fútbol</h1>
        <p>Panel de Usuario</p>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-item">
          <a href="#" class="nav-link active" onclick="showSection('inicio', event)">
            <i class="fas fa-home"></i>
            Inicio
          </a>
        </div>
        <div class="nav-item">
          <a href="#" class="nav-link" onclick="showSection('competencias', event)">
            <i class="fas fa-table"></i>
            Competencias
          </a>
        </div>
        <div class="nav-item">
          <a href="#" class="nav-link" onclick="showSection('equipos', event)">
            <i class="fas fa-users"></i>
            Equipos
          </a>
        </div>
        <div class="nav-item">
          <a href="#" class="nav-link" onclick="showSection('eventos', event)">
            <i class="fas fa-calendar"></i>
            Eventos
          </a>
        </div>
        <div class="nav-item">
          <a href="#" class="nav-link" onclick="showSection('multimedia', event)">
            <i class="fas fa-images"></i>
            Multimedia
          </a>
        </div>
        <div class="nav-item">
          <a href="#" class="nav-link" onclick="showSection('datos', event)">
            <i class="fas fa-database"></i>
            Datos
          </a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <button class="logout-btn" onclick="logout()">
          <i class="fas fa-sign-out-alt"></i>
          Cerrar Sesión
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <h1 class="topbar-title" id="pageTitle">Inicio</h1>
        <div class="topbar-actions">
          <span class="user-info">
            <i class="fas fa-user-circle"></i>
            Usuario
          </span>
        </div>
      </header>

      <div class="content">
        <!-- Selector de página -->
        <div class="section-card">
          <div class="card-content">
            <label style="font-weight:600; color: var(--text-primary); display: block; margin-bottom: 8px;">
              <i class="fas fa-trophy"></i> Selecciona un torneo:
            </label>
            <select id="pageSelector" style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 0.95rem;">
            </select>
            <p id="selectedPageInfo" style="margin-top: 12px; color: var(--text-secondary); font-size: 0.9rem;"></p>
          </div>
        </div>

        <!-- Inicio Section -->
        <section id="inicio" class="section active">
          <div class="hero-section">
            <div class="hero-overlay"></div>
            <div class="hero-content">
              <div class="hero-text">
                <h1 id="hero-title">Bienvenido</h1>
                <p id="hero-subtitle">Panel de Usuario</p>
              </div>
            </div>
          </div>

          <div class="section-card">
            <div class="card-header">
              <h2><i class="fas fa-info-circle"></i> Información Principal</h2>
              <p>Contenido del torneo</p>
            </div>
            <div class="card-content">
              <div id="text-inicio" class="content-html"></div>
            </div>
          </div>

          <div id="excel-inicio"></div>
        </section>

        <!-- Competencias Section -->
        <section id="competencias" class="section">
          <div class="section-card">
            <div class="card-header">
              <h2><i class="fas fa-trophy"></i> Tabla de Posiciones</h2>
              <p>Clasificación actual del torneo</p>
            </div>
            <div class="card-content">
              <div id="text-competencias" class="content-html"></div>
              <div class="table-container">
                <table class="modern-table" id="competencias-table">
                  <thead>
                    <tr>
                      <th style="text-align: center;">Pos</th>
                      <th>Equipo</th>
                      <th style="text-align: center;">PJ</th>
                      <th style="text-align: center;">G</th>
                      <th style="text-align: center;">E</th>
                      <th style="text-align: center;">P</th>
                      <th style="text-align: center;">GF</th>
                      <th style="text-align: center;">GC</th>
                      <th style="text-align: center;">DG</th>
                      <th style="text-align: center;">Pts</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
              <div id="excel-competencias"></div>
            </div>
          </div>
        </section>

        <!-- Equipos Section -->
        <section id="equipos" class="section">
          <div class="section-card">
            <div class="card-header">
              <h2><i class="fas fa-users"></i> Estadísticas de Equipos</h2>
              <p>Información de los equipos participantes</p>
            </div>
            <div class="card-content">
              <div id="text-equipos" class="content-html"></div>
              <div class="table-container">
                <table class="modern-table" id="equipos-table">
                  <thead>
                    <tr>
                      <th>Equipo</th>
                      <th style="text-align: center;">Partidos</th>
                      <th style="text-align: center;">G</th>
                      <th style="text-align: center;">E</th>
                      <th style="text-align: center;">P</th>
                      <th style="text-align: center;">GF</th>
                      <th style="text-align: center;">GC</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
              <div id="excel-equipos"></div>
            </div>
          </div>
        </section>

        <!-- Eventos Section -->
        <section id="eventos" class="section">
          <div class="section-card">
            <div class="card-header">
              <h2><i class="fas fa-calendar"></i> Partidos y Resultados</h2>
              <p>Calendario de encuentros</p>
            </div>
            <div class="card-content">
              <div id="text-eventos" class="content-html"></div>
              <div id="excel-eventos"></div>
            </div>
          </div>
        </section>

        <!-- Multimedia Section -->
        <section id="multimedia" class="section">
          <div class="section-card">
            <div class="card-header">
              <h2><i class="fas fa-images"></i> Galería</h2>
              <p>Contenido multimedia del torneo</p>
            </div>
            <div class="card-content">
              <div id="text-multimedia" class="content-html"></div>
              <div id="excel-multimedia" style="margin-top: 16px;"></div>
            </div>
          </div>
        </section>

        <!-- Datos Section -->
        <section id="datos" class="section">
          <div class="section-card">
            <div class="card-header">
              <h2><i class="fas fa-database"></i> Datos</h2>
              <p>Tablas de datos importadas</p>
            </div>
            <div class="card-content">
              <div id="tablesContainer" style="overflow: auto;"></div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script>
    // Check access
    const storedRole = localStorage.getItem('role');
    const userEmail = localStorage.getItem('userEmail');
    if (storedRole !== 'user' || !userEmail) {
      window.location.href = 'login.html';
    }

    // Logout
    function logout() {
      localStorage.removeItem('role');
      localStorage.removeItem('userEmail');
      localStorage.removeItem('selectedUserPage');
      window.location.href = 'login.html';
    }

    // Navigation
    function showSection(sectionId, event) {
      if (event) event.preventDefault();

      document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
      if (event && event.target) {
        const link = event.target.closest('.nav-link');
        if (link) link.classList.add('active');
      }

      document.querySelectorAll('.section').forEach(section => section.classList.remove('active'));
      const targetSection = document.getElementById(sectionId);
      if (targetSection) targetSection.classList.add('active');
      const titles = {
        'inicio': 'Inicio',
        'competencias': 'Competencias',
        'equipos': 'Equipos',
        'eventos': 'Eventos',
        'multimedia': 'Multimedia',
        'datos': 'Datos'
      };
      document.getElementById('pageTitle').textContent = titles[sectionId] || 'Panel';
    }

    // Load page selector
    function renderPageSelector() {
      const allPages = JSON.parse(localStorage.getItem('tournamentPages') || '[]');
      const selector = document.getElementById('pageSelector');
      const info = document.getElementById('selectedPageInfo');
      const userEmail = localStorage.getItem('userEmail');
      selector.innerHTML = '';

      const ownPages = allPages.filter(p => p.owner === userEmail);
      const pages = ownPages.length ? ownPages : allPages;

      if (!pages.length) {
        selector.innerHTML = '<option>No hay torneos disponibles</option>';
        info.textContent = '';
        return;
      }

      const defaultOpt = document.createElement('option');
      defaultOpt.value = '';
      defaultOpt.textContent = 'Selecciona un torneo...';
      selector.appendChild(defaultOpt);

      pages.forEach(page => {
        const opt = document.createElement('option');
        opt.value = page.id;
        opt.textContent = `${page.name} (${page.type})`;
        selector.appendChild(opt);
      });

      const selectedId = localStorage.getItem('selectedUserPage');
      if (selectedId && pages.some(p => p.id === selectedId)) {
        selector.value = selectedId;
      } else if (pages.length > 0) {
        selector.value = pages[0].id;
        localStorage.setItem('selectedUserPage', pages[0].id);
      }

      loadPageContent(selector.value);

      selector.onchange = () => {
        const id = selector.value;
        localStorage.setItem('selectedUserPage', id);
        loadPageContent(id);
      };
    }

    // Load page content
    function loadPageContent(pageId) {
      if (!pageId) return;

      const pages = JSON.parse(localStorage.getItem('tournamentPages') || '[]');
      const page = pages.find(p => p.id === pageId);
      const info = document.getElementById('selectedPageInfo');

      if (page && info) {
        info.textContent = `Torneo: ${page.name} (${page.type})`;
      }

      // Load text content
      ['inicio', 'competencias', 'equipos', 'eventos', 'multimedia'].forEach(sec => {
        const el = document.getElementById('text-' + sec);
        if (!el) return;
        const pageSpecificKey = `text-${pageId}-${sec}`;
        const globalKey = 'text-' + sec;
        const savedTxt = localStorage.getItem(pageSpecificKey) || localStorage.getItem(globalKey);
        if (savedTxt) {
          el.innerHTML = savedTxt;
        } else {
          el.innerHTML = '';
        }
      });

      // Load excel data
      const excelKey = `excelData-${pageId}`;
      const saved = localStorage.getItem(excelKey);
      if (saved) {
        try {
          const data = JSON.parse(saved);
          distributeData(data);
        } catch (e) {
          console.error('Error parsing excel data', e);
          document.getElementById('tablesContainer').innerHTML = '<p>Error al cargar los datos</p>';
        }
      } else {
        document.getElementById('tablesContainer').innerHTML = '';
      }
    }

    // Create table from sheet data
    function makeTable(sheet, sheetName) {
      const table = document.createElement('table');
      table.className = 'modern-table';

      if (!Array.isArray(sheet) || sheet.length === 0) {
        const emptyMessage = document.createElement('div');
        emptyMessage.textContent = `La hoja "${sheetName}" no contiene datos.`;
        emptyMessage.style.color = 'var(--text-secondary)';
        table.appendChild(emptyMessage);
        return table;
      }

      const headerRow = sheet[0];
      if (Array.isArray(headerRow)) {
        const header = table.insertRow();
        headerRow.forEach(cell => {
          const th = document.createElement('th');
          th.textContent = cell !== undefined && cell !== null ? cell : '';
          header.appendChild(th);
        });
      }

      for (let r = 1; r < sheet.length; r++) {
        const rowData = sheet[r];
        if (!Array.isArray(rowData)) continue;
        const row = table.insertRow();
        rowData.forEach(cell => {
          const td = row.insertCell();
          td.textContent = cell !== undefined && cell !== null ? cell : '';
        });
      }

      return table;
    }

    // Distribute data to sections
    function distributeData(data) {
      ['inicio', 'competencias', 'equipos', 'eventos', 'multimedia'].forEach(sec => {
        const el = document.getElementById('excel-' + sec);
        if (el) el.innerHTML = '';
      });

      const defaultCont = document.getElementById('tablesContainer');
      if (defaultCont) defaultCont.innerHTML = '';

      for (const sheetName in data) {
        const sheet = data[sheetName];
        const table = makeTable(sheet, sheetName);
        const name = sheetName.toLowerCase();
        let placed = false;

        if (name.includes('inicio') && document.getElementById('excel-inicio')) {
          document.getElementById('excel-inicio').appendChild(table);
          placed = true;
        }
        if (name.includes('competencia') && document.getElementById('excel-competencias')) {
          document.getElementById('excel-competencias').appendChild(table);
          placed = true;
        }
        if (name.includes('equipo') && document.getElementById('excel-equipos')) {
          document.getElementById('excel-equipos').appendChild(table);
          placed = true;
        }
        if ((name.includes('evento') || name.includes('partido')) && document.getElementById('excel-eventos')) {
          document.getElementById('excel-eventos').appendChild(table);
          placed = true;
        }
        if (name.includes('multimedia') && document.getElementById('excel-multimedia')) {
          document.getElementById('excel-multimedia').appendChild(table);
          placed = true;
        }

        if (!placed && defaultCont) {
          const title = document.createElement('h3');
          title.textContent = sheetName;
          title.style.cssText = 'color: var(--primary); margin: 24px 0 12px 0;';
          defaultCont.appendChild(title);
          defaultCont.appendChild(table);
        }
      }
    }

    // Listen for real-time updates
    window.addEventListener('storage', (event) => {
      if (event.key && (event.key.startsWith('text-') || event.key.startsWith('excelData-'))) {
        const currentPageId = localStorage.getItem('selectedUserPage');
        loadPageContent(currentPageId);
      }
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      renderPageSelector();
    });
  </script>
</body>
</html>
