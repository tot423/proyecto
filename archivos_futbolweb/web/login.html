<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Torneo Fútbol</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="brand">
        <div class="brand-icon">
          <i class="fas fa-trophy"></i>
        </div>
        <div>
          <h2>Torneo Fútbol</h2>
          <p>Panel administrativo</p>
        </div>
      </div>

      <div class="login-header">
        <h1>Iniciar sesión</h1>
        <p>Accede para gestionar competiciones, equipos y contenido.</p>
      </div>

      <form id="loginForm" class="login-form">
        <label class="field">
          <span>Correo electrónico</span>
          <input type="email" name="email" placeholder="usuario@correo.com" required>
        </label>

        <label class="field">
          <span>Contraseña</span>
          <input type="password" name="password" placeholder="••••••••" required>
        </label>

        <div class="options-row">
          <label class="remember-me">
            <input type="checkbox" name="remember">
            <span>Recordarme</span>
          </label>
          <a href="#">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="login-btn">
          <i class="fas fa-sign-in-alt"></i>
          Entrar
        </button>
      </form>

      <div class="login-footer">
        <p>¿No tienes cuenta? <a href="#">Contacta al administrador</a></p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function (event) {
      event.preventDefault();
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
